services:
  - type: web
    name: lowtides
    runtime: python
    plan: starter
    buildCommand: "echo no build step needed"
    startCommand: "python -m lowtides.server"
    healthCheckPath: /health
    disk:
      name: lowtides-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LOWTIDES_DB
        value: /var/data/lowtides.db
      - key: LOWTIDES_CONFIG
        value: /var/data/config.json
      - key: LOWTIDES_ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
