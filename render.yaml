services:
  - type: web
    name: lowtides
    runtime: python
    # Free plan: no cost, sleeps after ~15 idle minutes (first visit then takes about a minute)
    # and the database resets on each deploy. For a persistent ledger, switch to "starter"
    # and add a disk mounted at /var/data, then point LOWTIDES_DB and LOWTIDES_CONFIG there.
    plan: free
    buildCommand: "echo no build step needed"
    startCommand: "python -m lowtides.server"
    healthCheckPath: /health
    domains:
      - lowtides.ai
      - www.lowtides.ai
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Public demo for judges: no password, PayPal sandbox only, simulated AI models only,
      # a "Reset demo" button. Remove this line to run your own private, password-protected copy.
      - key: LOWTIDES_PUBLIC_DEMO
        value: "1"
      - key: LOWTIDES_DB
        value: /tmp/lowtides.db
      - key: LOWTIDES_CONFIG
        value: /tmp/config.json
      - key: LOWTIDES_ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
