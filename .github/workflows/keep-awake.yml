# Keeps the free-tier public demo awake so judges never wait for a cold start.
# Render's free plan sleeps after ~15 idle minutes; this visits /health every 10.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live demo
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://lowtides.ai/health
