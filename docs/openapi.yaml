  - name: "Dashboard: agents"
    description: Create agents and read their keys.
  - name: "Dashboard: approvals"
    description: A person approves or denies held purchases.
  - name: "Dashboard: kill switch"
    description: KILL one agent or STOP ALL.
  - name: "Dashboard: rules"
    description: Rules, merchants, forecast and audit.
  - name: "Dashboard: webhooks"
