components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: What went wrong, in plain English.
        issue:
          type: string
          description: PayPal issue code, when PayPal refused something.
    SpendRequest:
      type: object
      required:
        - amount
        - merchant
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
          description: Dollars.
        merchant:
          type: string
          maxLength: 120
          description: Who is being paid. Must match the merchant list to auto-approve.
        item:
          type: string
          maxLength: 300
          description: What is being bought.
        category:
          type: string
          maxLength: 60
          description: For category rules, e.g. data, software, travel.
        reason:
          type: string
          maxLength: 1000
          description: Why the agent needs it. Checked for prompt-injection text.
        task_id:
          type: string
          maxLength: 80
          description: Optional task to charge it to.
        settle:
          type: string
          enum:
            - external
          description: Set to external when the caller (e.g. PayPal's Agent Toolkit) moves the money itself.
    SpendDecision:
      type: object
      required:
        - id
        - decision
        - status
        - amount
        - merchant
        - reasons
        - flags
      properties:
        id:
          type: string
          pattern: "^sp_[0-9a-f]{16}$"
        ts:
          type: number
          description: Unix time the request was made.
        agent_id:
          type: integer
        agent_name:
          type:
            - string
            - "null"
        task_id:
          type:
            - string
            - "null"
        amount:
          type: number
        merchant:
          type: string
        item:
          type: string
        category:
          type: string
        reason:
          type: string
        decision:
          type: string
          enum:
            - approved
            - needs_approval
            - denied
          description: What the rules decided. Code decides, never the AI.
        status:
          type: string
          enum:
            - approved
            - pending
            - paid
            - denied
            - cancelled
            - failed
          description: "Where the money is now. pending = waiting for a person; failed = no money moved."
        reasons:
          type: array
          items:
            type: string
          description: Plain-English reasons for the decision.
        flags:
          type: array
          items:
            type: string
            enum:
              - new_merchant
              - possible_injection
              - duplicate
              - unusual_amount
              - velocity
              - paid_by_caller
        payee:
          type: string
          description: The PayPal email paid.
        payout_batch_id:
          type:
            - string
            - "null"
        payout_item_id:
          type:
            - string
            - "null"
        payout_status:
          type: string
          description: PayPal payout item status (SUCCESS, UNCLAIMED, PENDING, RETURNED...), SIMULATED without PayPal keys, or PAID_BY_CALLER.
        payout_env:
          type: string
          enum:
            - ""
            - sandbox
            - live
        payout_proof:
          type: string
          description: One line you can check against PayPal.
        simulated:
          type: boolean
        decided_by:
          type:
            - string
            - "null"
        decided_ts:
          type:
            - number
            - "null"
        note:
          type: string
    Budget:
      type: object
      required:
        - agent
        - status
        - tokens
        - purchases
        - rules
      properties:
        agent:
          type: string
        status:
          type: string
          enum:
            - "on"
            - paused
            - stopped
        tokens:
          type: object
          properties:
            daily_budget:
              type: number
            spent_today:
              type: number
        purchases:
          type: object
          properties:
            daily_limit:
              type: number
            spent_today:
              type: number
            remaining_today:
              type: number
            auto_approve_up_to:
              type: number
            max_per_purchase:
              type: number
        wallet_balance:
          type:
            - number
            - "null"
          description: Prepaid PayPal-funded wallet, when the agent uses one.
        rules:
          "$ref": "#/components/schemas/Rules"
        rules_in_plain_english:
          type: array
          items:
            type: string
    Rules:
      type: object
      description: Per-agent spending rules. Missing fields take their defaults.
      properties:
        max_per_purchase:
          type: number
          default: 50
        daily_purchase_limit:
          type: number
          default: 200
        approval_over:
          type: number
          default: 20
          description: Purchases above this wait for a person.
        daily_total_limit:
          type:
            - number
            - "null"
          description: "AI usage plus purchases together. null = off."
        allowed_categories:
          type: array
          items:
            type: string
          description: "Empty = any category not blocked."
        blocked_categories:
          type: array
          items:
            type: string
          default:
            - gift cards
            - crypto
        blocked_merchants:
          type: array
          items:
            type: string
        new_merchant_needs_approval:
          type: boolean
          default: true
        hours:
          type:
            - object
            - "null"
          properties:
            start:
              type: integer
            end:
              type: integer
        max_purchases_per_hour:
          type: integer
          default: 10
        max_reply_tokens:
          type:
            - integer
            - "null"
        max_input_tokens:
          type:
            - integer
            - "null"
        max_cost_per_call:
          type:
            - number
            - "null"
        dump_alert_multiple:
          type:
            - number
            - "null"
          default: 5
    RulesCompileResult:
      type: object
      properties:
        rules:
          "$ref": "#/components/schemas/Rules"
        set:
          type: array
          items:
            type: string
        source:
          type: string
          enum:
            - claude
            - offline
        model:
          type: string
        notes:
          type: array
          items:
            type: string
    Agent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key:
          type: string
          pattern: "^lt-"
          description: "The agent's Lowtides key: use it as the API key."
        daily_budget:
          type: number
        task_budget:
          type: number
        status:
          type: string
          enum:
            - "on"
            - paused
            - stopped
        client_id:
          type:
            - integer
            - "null"
        use_wallet:
          type: integer
        rules:
          type:
            - string
            - "null"
        created:
          type: number
    AgentCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        daily_budget:
          type: number
          exclusiveMinimum: 0
          description: AI usage, dollars a day.
        task_budget:
          type: number
          exclusiveMinimum: 0
        client_id:
          type:
            - integer
            - "null"
        use_wallet:
          type: boolean
          description: Spend only from a prepaid PayPal-funded wallet.
    State:
      type: object
      additionalProperties: true
      description: Everything the dashboard shows.
      properties:
        version:
          type: string
        mode:
          type: string
          enum:
            - home
            - business
        agents:
          type: array
          items:
            "$ref": "#/components/schemas/Agent"
        events:
          type: array
          items:
            type: object
        public_demo:
          type: boolean
        paypal_ready:
          type: boolean
    SpendList:
      type: object
      properties:
        requests:
          type: array
          items:
            "$ref": "#/components/schemas/SpendDecision"
    KillResult:
      type: object
      properties:
        stopped:
          type: boolean
        denied:
          type: integer
        holds_voided:
          type: integer
        payouts_cancelled:
          type: integer
        problems:
          type: array
          items:
            type: string
    StopAllResult:
      type: object
      properties:
        ok:
          type: boolean
        denied:
          type: integer
        holds_voided:
          type: integer
        payouts_cancelled:
          type: integer
    Merchant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        paypal_email:
          type: string
        category:
          type: string
        created:
          type: number
    Forecast:
      type: object
      properties:
        generated:
          type: number
        agents:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              status:
                type: string
              tokens_today:
                type: number
              purchases_today:
                type: number
              spent_today:
                type: number
              limit:
                type:
                  - number
                  - "null"
              limit_kind:
                type: string
              rate_per_hour:
                type: number
              projected_today:
                type: number
              minutes_to_limit:
                type:
                  - number
                  - "null"
    AuditVerify:
      type: object
      properties:
        ok:
          type: boolean
        count:
          type: integer
        broken_at:
          type:
            - integer
            - "null"
    ModelList:
      type: object
      properties:
        object:
          const: list
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              object:
                const: model
              owned_by:
                type:
                  - string
                  - "null"
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      additionalProperties: true
      description: OpenAI Chat Completions request. Other OpenAI fields pass through.
      properties:
        model:
          type: string
          description: The model asked for. Lowtides may route an easy step to a cheaper one.
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              content: {}
            required:
              - role
        max_tokens:
          type: integer
        stream:
          type: boolean
        tools:
          type: array
          items:
            type: object
    ChatCompletion:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        object:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
        usage:
          type: object
    MessageRequest:
      type: object
      required:
        - model
        - messages
        - max_tokens
      additionalProperties: true
      description: Anthropic Messages request. Other Anthropic fields pass through.
      properties:
        model:
          type: string
        max_tokens:
          type: integer
        system: {}
        messages:
          type: array
          items:
            type: object
        stream:
          type: boolean
    Message:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
        model:
          type: string
        content:
          type: array
          items:
            type: object
        usage:
          type: object
    BlockedError:
      type: object
      description: OpenAI-style or Anthropic-style error body.
      properties:
        type:
          type: string
        error:
          type: object
          properties:
            type:
              type: string
              examples:
                - lowtides_blocked
            code:
              type: string
              examples:
                - over_daily_budget
                - agent_stopped
                - agent_paused
                - loop_detected
            message:
              type: string
    WebhookCreate:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: For example a Zapier Catch Hook URL.
        label:
          type: string
          maxLength: 80
        events:
          type: array
          items:
            "$ref": "#/components/schemas/EventType"
          description: "Empty or missing = every event."
    Webhook:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        label:
          type: string
        events:
          type: array
          items:
            "$ref": "#/components/schemas/EventType"
        active:
          type: boolean
        created:
          type: number
        secret_hint:
          type: string
    WebhookCreated:
      type: object
      properties:
        webhook:
          "$ref": "#/components/schemas/Webhook"
        secret:
          type: string
          description: "Signing secret (whsec_...). Shown only once: save it now."
    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
        ts:
          type: number
        webhook_id:
          type: integer
        event_id:
          type: string
        event:
          type: string
        attempt:
          type: integer
        ok:
          type: integer
        status:
          type:
            - integer
            - "null"
        error:
          type: string
        ms:
          type: integer
    WebhookList:
      type: object
      properties:
        webhooks:
          type: array
          items:
            "$ref": "#/components/schemas/Webhook"
        deliveries:
          type: array
          items:
            "$ref": "#/components/schemas/WebhookDelivery"
        events:
          type: object
          additionalProperties:
            type: string
        signature_header:
          type: string
    WebhookTestResult:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type:
            - integer
            - "null"
        error:
          type:
            - string
            - "null"
        event:
          "$ref": "#/components/schemas/Event"
    EventType:
      type: string
      enum:
        - spend.needs_approval
        - spend.paid
        - spend.denied
        - agent.killed
        - stop_all
        - loop_guard.paused
    Event:
      type: object
      required:
        - id
        - type
        - created
        - data
      description: "What Lowtides POSTs to your webhook. Signed with the X-Lowtides-Signature header: t=<unix>,v1=<hex HMAC-SHA256 of \"<t>.<raw body>\" with your webhook secret>."
      properties:
        id:
          type: string
          pattern: "^evt_"
        type:
          type: string
          description: An EventType, or test.ping from the Test button.
        created:
          type: integer
        description:
          type: string
        dashboard:
          type:
            - string
            - "null"
        data:
          type: object
          additionalProperties: true
          description: "spend.* events carry the spend request (id, agent_name, amount, merchant, item, reasons, status...); spend.needs_approval adds approve_url. agent.killed carries the kill result; stop_all the totals; loop_guard.paused agent_id, agent_name and repeats."
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: lt-...
      description: The agent's Lowtides key (from the dashboard).
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: The same agent key, Anthropic-style.
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Dashboard password (LOWTIDES_ADMIN_TOKEN). Not needed in the public demo.
    adminCookie:
      type: apiKey
      in: cookie
      name: lt_admin
      description: Set by POST /api/login.
