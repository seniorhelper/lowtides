webhooks:
  spend.needs_approval:
    post:
      operationId: on_spend_needs_approval
      summary: A purchase is waiting for a person to approve or deny it.
      parameters:
        - name: X-Lowtides-Signature
          in: header
          required: true
          schema:
            type: string
          description: "t=<unix>,v1=<hex HMAC-SHA256 of \"<t>.<raw body>\">"
        - name: X-Lowtides-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Event"
      responses:
        "200":
          description: Any 2xx means received. Anything else is retried with backoff.
  spend.paid:
    post:
      operationId: on_spend_paid
      summary: A purchase was paid (PayPal Payouts, or simulated without PayPal keys).
      parameters:
        - name: X-Lowtides-Signature
          in: header
          required: true
          schema:
            type: string
          description: "t=<unix>,v1=<hex HMAC-SHA256 of \"<t>.<raw body>\">"
        - name: X-Lowtides-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Event"
      responses:
        "200":
          description: Any 2xx means received. Anything else is retried with backoff.
  spend.denied:
    post:
      operationId: on_spend_denied
      summary: A purchase was blocked by the rules or denied by a person.
      parameters:
        - name: X-Lowtides-Signature
